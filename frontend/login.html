<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - CompensationPro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="brand-badge">HR SaaS Compensation Platform</div>

        <h2>CompensationPro</h2>

        <p class="subtitle">
            Low-code style HR dashboard for compensation planning, pay equity analysis,
            SQL reporting and QA-ready workflows.
        </p>

        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Launch Dashboard</button>

        <p id="loginMessage"></p>

        <div class="demo-box">
            <p><strong>Demo Login</strong></p>
            <p>Username: admin</p>
            <p>Password: admin123</p>
        </div>
        <p class="home-link">
            <a href="index.html">← Back to Home</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>

</html>
